name: Manual release preparation (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Owner must configure required reviewers. This cue alone is not infrastructure authorization.
    environment: release-review
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m pip install -r backend/requirements.txt
      - run: python deploy/check_config.py
      - run: python deploy/scan_secrets.py
      - name: Collect integration tests without fixtures, sockets or services
        working-directory: backend
        run: python -m pytest pgtests redistests --ds=config.settings.testing --collect-only -q
      - name: Record the release boundary
        run: |
          printf '%s\n' 'Preparation only. PostgreSQL/Redis execution and deployment remain BLOCKED.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'No credentials, authorization records, migrations or remote executor are supplied.' >> "$GITHUB_STEP_SUMMARY"
