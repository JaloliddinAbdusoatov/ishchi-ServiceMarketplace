pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 6m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Request-ID $request_id;
    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 444; }
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-Request-ID $request_id always;
        location = /healthz { return 200 "ok\n"; }
        location ^~ /media/chat/ { return 404; }
        location ^~ /media/orders/ { return 404; }
        location ~ /\. { return 404; }
        location ~ ^/media/(workers/(photos|portfolio)|employers/photos|categories)/ {
            root /srv/ishchi;
            autoindex off;
            try_files $uri =404;
        }
        location /media/ { return 404; }
        location /static/ { alias /srv/ishchi/static/; autoindex off; }
        location /assets/ { try_files $uri =404; }
        location /api/ { proxy_pass http://127.0.0.1:8000; }
        location /django-admin/ { proxy_pass http://127.0.0.1:8000; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
