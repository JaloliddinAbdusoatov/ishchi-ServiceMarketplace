# PREPARED ONLY: starting an infrastructure profile provisions NEW databases/roles.
# Obtain exact owner authorization first. No service starts without a profile.
name: ishchi-local
x-pg: &pg
  image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
  environment: &pg-env
    POSTGRES_USER: ishchi_bootstrap
    POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
    interval: 3s
    timeout: 3s
    retries: 20
  stop_grace_period: 30s
x-redis: &redis
  image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
  command: [sh, /bootstrap/redis-start.sh]
  healthcheck:
    # A successful TCP response must deny anonymous access; no privileged probe.
    test: [CMD-SHELL, 'redis-cli ping 2>&1 | grep -q NOAUTH']
    interval: 3s
    timeout: 3s
    retries: 20
  stop_grace_period: 30s
x-app: &app
  image: ${LOCAL_BACKEND_IMAGE:-ishchi-backend:local}
  build: {context: ../backend}
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
  environment: &app-env
    DJANGO_SETTINGS_MODULE: config.settings.local_postgres
    ISHCHI_ENV: local
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_key
    DB_PASSWORD_FILE: /run/secrets/app_password
    REDIS_PASSWORD_FILE: /run/secrets/redis_password
    DB_AUTHORIZATION_FILE: /run/secrets/db_approval
    REDIS_AUTHORIZATION_FILE: /run/secrets/redis_approval
    DJANGO_MEDIA_ROOT: /app/media
    HEALTHCHECK_HOST: localhost
  networks: [work]
  volumes: ["media:/app/media", "static:/app/staticfiles"]
  stop_grace_period: 45s
services:
  postgres-work:
    <<: *pg
    profiles: [work]
    environment:
      <<: *pg-env
      POSTGRES_DB: ishchi_marketplace_local
      ISHCHI_DB_ROLE: ishchi_local_app
    ports: ["127.0.0.1:55432:5432"]
    networks: [work]
    volumes:
      - pg-work:/var/lib/postgresql
      - ./local/postgres-init.sh:/docker-entrypoint-initdb.d/10-ishchi.sh:ro
    secrets:
      - {source: work_pg_bootstrap, target: bootstrap_password}
      - {source: work_pg_password, target: app_password}
  postgres-test:
    <<: *pg
    profiles: [test]
    environment:
      <<: *pg-env
      POSTGRES_DB: ishchi_marketplace_sprint1_local
      ISHCHI_DB_ROLE: ishchi_local_test
    ports: ["127.0.0.1:55433:5432"]
    networks: [test]
    volumes:
      - pg-test:/var/lib/postgresql
      - ./local/postgres-init.sh:/docker-entrypoint-initdb.d/10-ishchi.sh:ro
    secrets:
      - {source: test_pg_bootstrap, target: bootstrap_password}
      - {source: test_pg_password, target: app_password}
  redis-work:
    <<: *redis
    profiles: [work]
    environment: {ISHCHI_REDIS_ROLE: ishchi_local_app}
    ports: ["127.0.0.1:56379:6379"]
    networks: [work]
    volumes: ["redis-work:/data", "./local/redis-start.sh:/bootstrap/redis-start.sh:ro"]
    secrets: [{source: work_redis_password, target: redis_password}]
  redis-test:
    <<: *redis
    profiles: [test]
    environment: {ISHCHI_REDIS_ROLE: ishchi_local_test}
    ports: ["127.0.0.1:56380:6379"]
    networks: [test]
    volumes: ["redis-test:/data", "./local/redis-start.sh:/bootstrap/redis-start.sh:ro"]
    secrets: [{source: test_redis_password, target: redis_password}]
  backend:
    <<: *app
    profiles: [work]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres-work: {condition: service_healthy}
      redis-work: {condition: service_healthy}
    secrets:
      - {source: django_key, target: django_key}
      - {source: work_pg_password, target: app_password}
      - {source: work_redis_password, target: redis_password}
      - {source: work_db_approval, target: db_approval}
      - {source: work_redis_approval, target: redis_approval}
  gateway:
    image: ${LOCAL_FRONTEND_IMAGE:-ishchi-frontend:local}
    build: {context: ../frontend}
    profiles: [work]
    network_mode: service:backend
    depends_on: {backend: {condition: service_started}}
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    volumes:
      - ./local/nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/srv/ishchi/media:ro
      - static:/srv/ishchi/static:ro
  migrate:
    <<: *app
    profiles: [operator]
    command: [python, manage.py, migrate, --noinput]
    secrets:
      - {source: django_key, target: django_key}
      - {source: work_pg_password, target: app_password}
      - {source: work_redis_password, target: redis_password}
      - {source: work_db_migration_approval, target: db_approval}
      - {source: work_redis_approval, target: redis_approval}
networks:
  # Docker Desktop suppresses host port forwarding on internal networks.
  # Separate bridges plus explicit loopback publication retain host isolation.
  work:
    driver: bridge
    driver_opts: {com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"}
  test:
    driver: bridge
    driver_opts: {com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"}
volumes:
  pg-work:
  pg-test:
  redis-work:
  redis-test:
  media:
  static:
secrets:
  django_key: {file: '${LOCAL_SECRETS_DIR:?Set an absolute secret directory}/django_key'}
  work_pg_bootstrap: {file: '${LOCAL_SECRETS_DIR:?}/work_pg_bootstrap'}
  test_pg_bootstrap: {file: '${LOCAL_SECRETS_DIR:?}/test_pg_bootstrap'}
  work_pg_password: {file: '${LOCAL_SECRETS_DIR:?}/work_pg_password'}
  test_pg_password: {file: '${LOCAL_SECRETS_DIR:?}/test_pg_password'}
  work_redis_password: {file: '${LOCAL_SECRETS_DIR:?}/work_redis_password'}
  test_redis_password: {file: '${LOCAL_SECRETS_DIR:?}/test_redis_password'}
  work_db_approval: {file: '${LOCAL_SECRETS_DIR:?}/work-db-authorization.json'}
  work_db_migration_approval: {file: '${LOCAL_SECRETS_DIR:?}/work-db-migration-authorization.json'}
  work_redis_approval: {file: '${LOCAL_SECRETS_DIR:?}/work-redis-authorization.json'}
